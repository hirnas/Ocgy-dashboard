<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Map - Canada Ocean Dashboard</title>
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.10.5/dist/leaflet.css" integrity="sha256-sA+G4vVQ+K6GkZz2f4y6j6zG9p3Tn4x6+5ZcS0Z6Lw=" crossorigin="" />
  <style>
    body, html { height: 100%; margin: 0; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.10.5/dist/leaflet.js" integrity="sha256-sA+G4vVQ+K6GkZz2f4y6j6zG9p3Tn4x6+5ZcS0Z6Lw=" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([45.42, -75.69], 5);
    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
      attribution: 'Map data &copy; OpenTopoMap contributors'
    }).addTo(map);
    const bathy = L.tileLayer('http://localhost:8080/tiles/{z}/{x}/{y}.png', {
      opacity: 0.6,
      maxZoom: 7
    }).addTo(map);
  </script>
</body>
</html>
